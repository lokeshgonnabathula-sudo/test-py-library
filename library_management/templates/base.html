<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Library Management System{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 15px; color: #222; }
        nav { margin-bottom: 25px; padding-bottom: 10px; border-bottom: 2px solid #333; }
        nav a { margin-right: 15px; text-decoration: none; color: #2c5aa0; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
        th { background-color: #2c5aa0; color: white; }
        tr:nth-child(even) { background-color: #f7f7f7; }
        form input, form select { padding: 6px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        form label { font-weight: bold; margin-top: 10px; display: block; }
        button, .btn { background-color: #2c5aa0; color: white; border: none; padding: 8px 14px;
                       border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover, .btn:hover { background-color: #1e3f75; }
        .flash { padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .flash.success { background-color: #d4edda; color: #155724; }
        .flash.error { background-color: #f8d7da; color: #721c24; }
        .badge-low { color: #c0392b; font-weight: bold; }
        .overdue { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">📚 Books</a>
        <a href="{{ url_for('add_book') }}">+ Add Book</a>
        <a href="{{ url_for('members') }}">👤 Members</a>
        <a href="{{ url_for('add_member') }}">+ Add Member</a>
        <a href="{{ url_for('issue_book') }}">Issue Book</a>
        <a href="{{ url_for('records') }}">Borrow Records</a>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
